project:
  type: website
  output-dir: _site

website:
  title: "EpiAware"
  description: "Composable tools for infectious disease modelling in Julia."
  site-url: https://epiaware.github.io
  repo-url: https://github.com/EpiAware/epiaware.github.io
  repo-actions: [edit, issue]
  favicon: assets/img/logo.svg
  open-graph: true
  twitter-card: true
  # Navbar and footer are not configured here: the shared partials in
  # _includes/navbar.html and _includes/footer.html are the single source
  # of truth for the ecosystem chrome, injected below via
  # format.html.include-before-body / include-after-body. The tutorials
  # site renders the same partials via a git submodule, so both sites
  # share one navbar and footer definition.
  #
  # `search: true` here is still required even with no navbar/sidebar
  # config: it is what makes Quarto emit search.json and the
  # site_libs/quarto-search/* assets and JS. The shared navbar partial
  # then supplies its own `<div id="quarto-search">` markup, which
  # quarto-search.js hydrates by id regardless of where it lives in the
  # DOM. Each site sets this independently, so search stays per-site:
  # this site searches epiaware.org content, the tutorials site (once it
  # sets the same flag) searches its own content.
  search: true

format:
  html:
    theme:
      light: [cosmo, theme-light.scss]
      dark: [cosmo, theme-dark.scss]
    css: styles.css
    toc: true
    toc-depth: 3
    anchor-sections: true
    smooth-scroll: true
    code-copy: true
    code-overflow: wrap
    grid:
      sidebar-width: 250px
      body-width: 940px
    include-before-body: [_includes/navbar.html]
    include-after-body: [_includes/footer.html]
